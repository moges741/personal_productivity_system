services:
  - type: web
    name: productivity-backend
    runtime: node
    region: oregon
    plan: free

    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: 20.11.0

      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: productivity-db
          property: connectionString

      - key: JWT_ACCESS_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

databases:
  - name: productivity-db
    databaseName: productivity
    user: productivity_user
    region: oregon
    plan: free
```

