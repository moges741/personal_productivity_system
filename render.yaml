services:
  - type: web
    name: productivity-backend
    runtime: node
    region: oregon
    plan: free

    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: 20.11.0

      - key: NODE_ENV
        value: production

      # You already have these deployed externally —
      # set sync: false and paste the real values in Render dashboard
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production

      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d


# NO databases: section — you're bringing your own Postgres and Redis